version: '3.9'

services:
  web:
    build: .
    command: >
      bash -c "python manage.py migrate && python manage.py csu && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./.env
    environment:
      - DEBUG=False
      - DATABASE_HOST=db
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    env_file:
      - ./.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: "redis:6"
    volumes:
      - redis_data:/data

  celery:
    build: .
    command: >
      bash -c "celery -A drf_hw  worker --loglevel=info --pool=eventlet"
    ports:
      - "6379:6379"
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    command: >
      bash -c "celery -A drf_hw beat --loglevel=info"
    env_file:
      - ./.env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - celery

networks:
  default:

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  redis_data:
    driver: local

