  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}  # Используем ваш SSH_KEY

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SERVER_IP }}      # Ваш SERVER_IP
          SSH_USER: ${{ secrets.SSH_USER }}        # Ваш SSH_USER
          PROJECT_DIR: ${{ secrets.DEPLOY_DIR }}   # Ваш DEPLOY_DIR
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}  # Другие переменные...
        run: |
          # Копируем код на сервер (исключаем .git/, .env, __pycache__)
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='__pycache__/' \
            --exclude='.github/' \
            ./ $SSH_USER@$SSH_HOST:$PROJECT_DIR/
          
          # Выполняем команды на сервере
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
            cd $PROJECT_DIR
          
            # Обновляем зависимости через Poetry
            poetry install --no-dev
          
            # Применяем миграции (если нужно)
            poetry run python manage.py migrate --noinput
          
            # Собираем статику (если используется)
            poetry run python manage.py collectstatic --noinput || true
          
            # Перезапускаем Gunicorn (через systemd)
            sudo systemctl restart gunicorn
          
            # Перезапускаем Nginx (если используется)
            sudo systemctl restart nginx || true
          "